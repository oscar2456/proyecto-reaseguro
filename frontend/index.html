<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Contratos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CRUD Contratos</h1>

    <div id="form-container">
        <h2>Crear/Actualizar Contrato</h2>
        <form id="contrato-form">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="montoPrima">Monto Prima:</label>
            <input type="number" id="montoPrima" name="montoPrima" step="0.01" required><br><br>

            <input type="hidden" id="contratoId" name="contratoId">
            <button type="submit" id="submit-button">Crear</button>
        </form>
    </div>

    <div id="contratos-container">
        <h2>Lista de Contratos</h2>
        <ul id="contratos-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
